apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiteworks-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/icelex10/KiteworksTestApp.git
    targetRevision: gitops
    path: gitops/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: kiteworks-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
