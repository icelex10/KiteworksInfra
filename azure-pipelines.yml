trigger: none
pr: none

parameters:
- name: targetEnvironment
  displayName: Environments to deploy (cumulative)
  type: string
  default: 'dev'
  values: ['dev', 'staging', 'all']
- name: installArgoCD
  displayName: Install Argo CD
  type: string
  default: 'false'
  values: ['false', 'true']
- name: installNginxIngress
  displayName: Install NGINX Ingress
  type: string
  default: 'true'
  values: ['false', 'true']
- name: destroyAfterDelay
  displayName: Destroy everything after a delay
  type: string
  default: 'false'
  values: ['false', 'true']
- name: destroyDelayMinutes
  displayName: Delay in minutes before destroy
  type: string
  default: '60'

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'sc-kiteworks-azure'
  terraformDir: '$(System.DefaultWorkingDirectory)/terraform'
  tfStateResourceGroup: 'rg-kiteworkstest-platform'
  tfStateStorageAccount: 'sakiteworkstfstate1'
  tfStateContainer: 'tfstate'
  tfStateKey: 'resource-groups.terraform.tfstate'
  terraformVersion: '1.9.8'

stages:
- stage: DeployFoundation
  displayName: Deploy environment resource groups
  jobs:
  - job: Terraform
    timeoutInMinutes: '90'
    steps:
    - bash: |
        set -euo pipefail
        install_dir="$(Agent.TempDirectory)/terraform-bin"
        mkdir -p "$install_dir"
        curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
        unzip -oq terraform.zip -d "$install_dir"
        chmod +x "$install_dir/terraform"
        echo "##vso[task.setvariable variable=terraformCommand]$install_dir/terraform"
      displayName: Install Terraform

    - task: HelmInstaller@1
      displayName: Install Helm
      condition: and(succeeded(), or(eq('${{ parameters.installArgoCD }}', 'true'), eq('${{ parameters.installNginxIngress }}', 'true')))
      inputs:
        helmVersionToInstall: '3.16.4'

    - task: KubectlInstaller@0
      displayName: Install kubectl
      condition: and(succeeded(), or(eq('${{ parameters.installArgoCD }}', 'true'), eq('${{ parameters.installNginxIngress }}', 'true')))
      inputs:
        kubectlVersion: 'latest'

    - task: AzureCLI@2
      displayName: Terraform apply
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(terraformDir)'
        addSpnToEnvironment: true
        inlineScript: |
          set -euo pipefail

          export ARM_USE_OIDC=true
          export ARM_USE_AZUREAD=true
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$tenantId"
          export ARM_OIDC_TOKEN="$idToken"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

          tf="$(terraformCommand)"

          $tf init -lock-timeout=5m \
            -backend-config="resource_group_name=$(tfStateResourceGroup)" \
            -backend-config="storage_account_name=$(tfStateStorageAccount)" \
            -backend-config="container_name=$(tfStateContainer)" \
            -backend-config="key=$(tfStateKey)"

          $tf fmt -check -recursive
          $tf validate

          env="${{ parameters.targetEnvironment }}"
          case "$env" in
            dev)     envs="dev";              var_json='["dev"]' ;;
            staging) envs="dev staging";      var_json='["dev","staging"]' ;;
            all)     envs="dev staging prod"; var_json='["dev","staging","prod"]' ;;
          esac

          $tf plan -lock-timeout=5m -out=tfplan -var="deploy_environments=$var_json"
          $tf apply -lock-timeout=5m -auto-approve tfplan

          if [ "${{ parameters.installNginxIngress }}" = "true" ] || [ "${{ parameters.installArgoCD }}" = "true" ]; then
            ingress_ips_json="$($tf output -json ingress_public_ip)"

            if [ "${{ parameters.installNginxIngress }}" = "true" ]; then
              helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
              helm repo update
            fi

            if [ "${{ parameters.installArgoCD }}" = "true" ]; then
              helm repo add argo https://argoproj.github.io/argo-helm
              helm repo update
            fi

            for e in $envs; do
              az aks get-credentials -g "rg-kiteworks-$e" -n "aks-kiteworks-$e" --admin --overwrite-existing

              if [ "${{ parameters.installNginxIngress }}" = "true" ]; then
                ingress_ip="$(jq -r --arg environment "$e" '.[$environment]' <<< "$ingress_ips_json")"
                if [ -z "$ingress_ip" ] || [ "$ingress_ip" = "null" ]; then
                  echo "No ingress public IP found for $e"
                  exit 1
                fi

                helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
                  --namespace ingress-nginx --create-namespace \
                  --set controller.service.type=LoadBalancer \
                  --set controller.service.loadBalancerIP="$ingress_ip" \
                  --set-string 'controller.service.annotations.service\.beta\.kubernetes\.io/azure-load-balancer-health-probe-request-path=/healthz' \
                  --wait --timeout 10m
              fi

              if [ "${{ parameters.installArgoCD }}" = "true" ]; then
                helm upgrade --install argocd argo/argo-cd \
                  -n argocd --create-namespace \
                  --set server.service.type=ClusterIP \
                  --wait --timeout 10m

                kubectl apply -f "$(System.DefaultWorkingDirectory)/gitops/argocd/application-$e.yaml"
              fi
            done
          fi

          if [ "${{ parameters.destroyAfterDelay }}" = "true" ]; then
            sleep "${{ parameters.destroyDelayMinutes }}m"
            $tf destroy -lock-timeout=5m -auto-approve -var="deploy_environments=$var_json"
          fi
