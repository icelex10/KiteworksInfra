trigger: none

pr: none

parameters:
- name: destroyAfterDelay
  displayName: Destroy all Terraform-managed resources after deployment
  type: string
  default: 'false'
  values:
  - 'false'
  - 'true'
- name: destroyDelayMinutes
  displayName: Minutes to wait before destruction
  type: string
  default: '60'

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'sc-kiteworks-azure'
  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
  tfStateResourceGroup: 'rg-kiteworkstest-platform'
  tfStateStorageAccount: 'sakiteworkstfstate1'
  tfStateContainer: 'tfstate'
  tfStateKey: 'resource-groups.terraform.tfstate'
  terraformVersion: '1.9.8'

stages:
- stage: DeployFoundation
  displayName: Deploy environment resource groups
  jobs:
  - job: Terraform
    displayName: Deploy environment resource groups with Terraform
    steps:
    - bash: |
        set -euo pipefail

        install_dir="$(Agent.TempDirectory)/terraform-bin"
        mkdir -p "$install_dir"

        curl -fsSLo terraform.zip \
          "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
        unzip -oq terraform.zip -d "$install_dir"
        chmod 0755 "$install_dir/terraform"
        echo "##vso[task.setvariable variable=terraformCommand]$install_dir/terraform"
        "$install_dir/terraform" version
      displayName: Install Terraform

    - task: AzureCLI@2
      displayName: Terraform init, validate, plan, and apply
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(terraformWorkingDirectory)'
        addSpnToEnvironment: true
        inlineScript: |
          set -euo pipefail

          az account show --output table

          export ARM_USE_OIDC=true
          export ARM_USE_AZUREAD=true
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$tenantId"
          export ARM_OIDC_TOKEN="$idToken"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id --output tsv)"

          az storage blob list \
            --account-name "$(tfStateStorageAccount)" \
            --container-name "$(tfStateContainer)" \
            --auth-mode login \
            --output table

          "$(terraformCommand)" init \
            -backend-config="resource_group_name=$(tfStateResourceGroup)" \
            -backend-config="storage_account_name=$(tfStateStorageAccount)" \
            -backend-config="container_name=$(tfStateContainer)" \
            -backend-config="key=$(tfStateKey)"

          "$(terraformCommand)" fmt -check -recursive
          "$(terraformCommand)" validate

          "$(terraformCommand)" plan -out=tfplan

          "$(terraformCommand)" apply -auto-approve tfplan

          "$(terraformCommand)" output

          helm version
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

          for environment in dev staging prod; do
            aks_resource_group="rg-kiteworks-${environment}"
            aks_name="aks-kiteworks-${environment}"

            az aks get-credentials \
              --resource-group "$aks_resource_group" \
              --name "$aks_name" \
              --admin \
              --overwrite-existing

            helm upgrade --install argocd argo/argo-cd \
              --namespace argocd \
              --create-namespace \
              --set server.service.type=ClusterIP \
              --wait \
              --timeout 10m

            kubectl apply \
              --filename "$(System.DefaultWorkingDirectory)/gitops/argocd/application-${environment}.yaml"
          done

          if [[ '${{ parameters.destroyAfterDelay }}' == 'true' ]]; then
            echo "Destroy enabled; waiting ${{ parameters.destroyDelayMinutes }} minutes."
            sleep "${{ parameters.destroyDelayMinutes }}m"
            "$(terraformCommand)" destroy \
              -lock-timeout=5m \
              -auto-approve
          fi